<!-- src/main/resources/templates/email/expenditure-recommend.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .header p {
            margin: 10px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .content {
            padding: 40px 30px;
        }
        .message-box {
            background-color: #f0f9ff;
            border-left: 4px solid #0284c7;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .message-box p {
            color: #0c4a6e;
            margin: 0;
            font-size: 16px;
            line-height: 1.6;
        }
        .total-amount-box {
            text-align: center;
            padding: 25px;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border-radius: 12px;
            margin: 30px 0;
        }
        .total-amount-label {
            color: #0369a1;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .total-amount {
            color: #0284c7;
            font-size: 32px;
            font-weight: 700;
            margin: 0;
        }
        .divider {
            height: 1px;
            background-color: #e5e7eb;
            margin: 30px 0;
        }
        .section-title {
            color: #374151;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .recommendation-list {
            margin: 20px 0;
        }
        .recommendation-item {
            background-color: #f9fafb;
            padding: 15px 20px;
            border-radius: 8px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .recommendation-item:hover {
            background-color: #f3f4f6;
            transform: translateX(5px);
        }
        .category-name {
            font-weight: 600;
            color: #374151;
            font-size: 16px;
        }
        .budget-info {
            text-align: right;
        }
        .budget-amount {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
        }
        .budget-label {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }
        .footer {
            background-color: #f9fafb;
            padding: 20px 30px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }
        .footer p {
            margin: 5px 0;
        }
        .emoji {
            font-size: 24px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 헤더 -->
    <div class="header">
        <h1><span class="emoji">💰</span> 오늘의 지출 추천</h1>
        <p th:text="${#temporals.format(#temporals.createNow(), 'yyyy년 MM월 dd일 EEEE', 'ko')}">2024년 12월 4일 수요일</p>
    </div>

    <!-- 메인 컨텐츠 -->
    <div class="content">
        <!-- 메시지 -->
        <div class="message-box">
            <p th:text="${message}">절약을 잘 실천하고 계시네요!</p>
        </div>

        <!-- 오늘 총 사용 가능 금액 -->
        <div class="total-amount-box">
            <p class="total-amount-label">오늘 총 사용 가능 금액</p>
            <p class="total-amount" th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')} + '원'">50,000원</p>
        </div>

        <div class="divider"></div>

        <!-- 카테고리별 추천 금액 -->
        <h2 class="section-title">📊 카테고리별 오늘의 추천 금액</h2>

        <div class="recommendation-list">
            <div class="recommendation-item" th:each="recommend : ${recommendList}">
                <span class="category-name" th:text="${recommend.category.name}">식비</span>
                <div class="budget-info">
                    <div class="budget-amount" th:text="${#numbers.formatInteger(recommend.todayExpenditurePossibleMoney, 0, 'COMMA')} + '원'">10,000원</div>
                    <div class="budget-label">오늘 사용 가능</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 푸터 -->
    <div class="footer">
        <p><strong>현명한 소비 습관을 응원합니다! 🌟</strong></p>
        <p style="margin-top: 10px; font-size: 12px; color: #9ca3af;">이 메일은 매일 오전 8시에 자동으로 발송됩니다.</p>
    </div>
</div>
</body>
</html>
