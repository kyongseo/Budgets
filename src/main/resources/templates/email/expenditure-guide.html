<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 지출 안내</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background-color: #f5f5f5;">
<div style="max-width: 600px; margin: 40px auto; padding: 0; background-color: #f9f9f9;">

    <!-- 헤더 -->
    <div style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 40px 30px; text-align: center;">
        <h1 style="margin: 0; font-size: 28px; font-weight: bold;">📝 오늘의 지출 안내</h1>
        <p style="margin: 10px 0 0 0; font-size: 14px; opacity: 0.9;">Budget Management Service</p>
    </div>

    <!-- 본문 -->
    <div style="background-color: white; padding: 40px 30px;">

        <!-- 총 지출 금액 -->
        <div style="background: linear-gradient(135deg, #fff0f0 0%, #ffe8e8 100%); padding: 25px; border-radius: 12px; margin-bottom: 30px; text-align: center; box-shadow: 0 2px 8px rgba(245, 87, 108, 0.1);">
            <p style="margin: 0; font-size: 14px; color: #666; font-weight: 500;">오늘 총 지출 금액</p>
            <h2 style="margin: 15px 0 0 0; color: #f5576c; font-size: 36px; font-weight: bold;" th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')} + '원'">0원</h2>
        </div>

        <!-- 카테고리별 지출 -->
        <h3 style="color: #333; margin: 0 0 20px 0; font-size: 18px; font-weight: bold;">📊 카테고리별 지출 내역</h3>

        <div th:if="${guideList != null and !guideList.isEmpty()}">
            <div th:each="guide : ${guideList}"
                 style="margin-bottom: 20px; padding: 20px; border-radius: 12px; border-left: 4px solid;"
                 th:styleappend="${guide.risk == 'HIGH'} ? 'background-color: #ffebee; border-left-color: #f44336;' :
                                     ${guide.risk == 'MEDIUM'} ? 'background-color: #fff3e0; border-left-color: #ff9800;' :
                                     'background-color: #e8f5e9; border-left-color: #4caf50;'">

                <div style="font-weight: bold; color: #333; margin-bottom: 12px; font-size: 16px;" th:text="${guide.category.name}">카테고리</div>

                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <div style="flex: 1;">
                        <div style="font-size: 13px; color: #666; margin-bottom: 4px;">오늘 지출</div>
                        <div style="font-weight: bold; font-size: 18px;"
                             th:styleappend="${guide.risk == 'HIGH'} ? 'color: #f44336;' :
                                                ${guide.risk == 'MEDIUM'} ? 'color: #ff9800;' :
                                                'color: #4caf50;'"
                             th:text="${#numbers.formatInteger(guide.todayExpenditureAmount, 0, 'COMMA')} + '원'">0원</div>
                    </div>
                    <div style="flex: 1; text-align: right;">
                        <div style="font-size: 13px; color: #666; margin-bottom: 4px;">적정 금액</div>
                        <div style="font-weight: bold; color: #666; font-size: 18px;" th:text="${#numbers.formatInteger(guide.todayAppropriateExpenditureAmount, 0, 'COMMA')} + '원'">0원</div>
                    </div>
                </div>

                <div style="text-align: right; margin-top: 12px;">
                        <span style="padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white;"
                              th:styleappend="${guide.risk == 'HIGH'} ? 'background-color: #f44336;' :
                                             ${guide.risk == 'MEDIUM'} ? 'background-color: #ff9800;' :
                                             'background-color: #4caf50;'"
                              th:text="${guide.risk}">RISK</span>
                </div>
            </div>
        </div>

        <div th:if="${guideList == null or guideList.isEmpty()}"
             style="background-color: #e3f2fd; padding: 20px; border-radius: 12px; border-left: 4px solid #2196f3;">
            <p style="margin: 0; color: #1565c0; font-size: 15px;">ℹ️ 오늘 지출 내역이 없습니다.</p>
        </div>

    </div>

    <!-- 푸터 -->
    <div style="background-color: #f5f5f5; padding: 20px 30px; text-align: center; border-top: 1px solid #e0e0e0;">
        <p style="margin: 0; font-size: 12px; color: #999;">
            본 메일은 Budget Management 서비스에서 자동으로 발송되었습니다.
        </p>
    </div>

</div>
</body>
</html>
