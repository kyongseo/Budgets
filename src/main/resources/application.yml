management:
  endpoints:
    web:
      exposure:
        include: metrics,health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

spring:
  application:
    name: BudgetManagementProject
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local
  jpa:
    show-sql: true
    database: postgresql
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        generate_statistics: true
        format_sql: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 100
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  security:
    user:
      name: disabled
      password: disable
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  management:
    endpoints:
      web:
        exposure:
          include: health

logging:
  level:
    ks.com.budgetmanagementproject: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN

springdoc:
  swagger-ui:
    display-operation-id: true
    path: /swagger-ui.html
  cache:
    disabled: true

server:
  port: 9091

