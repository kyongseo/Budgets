spring:
  application:
    name: BudgetManagementProject
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local
  jpa:
    show-sql: true
    database: postgresql
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  security:
    user:
      name: disabled
      password: disable
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG

springdoc:
  swagger-ui:
    display-operation-id: true
    operationsSorter: "(a,b)=>{const ord=o=>o.operation?.['x-order'] ?? parseInt((o.operation?.operationId||'').match(/^\\d+/)?.[0]||'0',10); return ord(a)-ord(b);}"
    tagsSorter: "alpha"
    path: /swagger-ui.html
  cache:
    disabled: true

server:
  port: 9091