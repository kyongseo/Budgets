<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>💬 채팅</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; }
        #messages { border:1px solid #ccc; padding:10px; width:400px; height:200px; overflow:auto; margin-top:10px; }
    </style>
</head>
<body>
<h2>💬 간단 채팅</h2>

<div>
    <label>채팅방 ID: </label>
    <input type="text" id="roomId" value="1" />
    <button onclick="connect()">연결</button>
    <button onclick="disconnect()">해제</button>
</div>

<div style="margin-top:10px;">
    <label>메시지: </label>
    <input type="text" id="messageInput" />
    <button onclick="sendMessage()">전송</button>
</div>

<div id="messages"></div>

<script>
    let client = null;
    let sub = null;
    let currentRoom = null;

    const chatHistories = {}; // { "1": ["...", "..."], "2": ["...", "..."] }

    const username = localStorage.getItem("username") || "익명";

    function connect() {
        const roomId = document.getElementById("roomId").value.trim();

        if (!roomId) {
            alert("채팅방 번호를 입력하세요.");
            return;
        }

        if (client && client.active) {
            moveRoom(roomId);
            return;
        }

        const socket = new SockJS("http://localhost:9091/ws-stomp");
        client = new StompJs.Client({
            webSocketFactory: () => socket,
            reconnectDelay: 3000,
            debug: (str) => console.log(str),
            onConnect: () => {
                console.log("✅ 연결 성공");
                subscribeRoom(roomId);
            }
        });
        client.activate();
    }

    function subscribeRoom(roomId) {
        // 기존 구독 해제 후
        if (sub) sub.unsubscribe();

        currentRoom = roomId;

        const box = document.getElementById("messages");
        box.innerHTML = "";

        if (chatHistories[roomId]) {
            chatHistories[roomId].forEach(msg => box.innerHTML += msg);
        }

        sub = client.subscribe("/sub/" + roomId, (message) => {
            const payload = JSON.parse(message.body);
            const formatted = `<div><strong>${payload.sender}</strong> : ${payload.message}</div>`;

            // UI append
            box.innerHTML += formatted;
            box.scrollTop = box.scrollHeight;

            // 캐싱 저장
            if (!chatHistories[roomId]) chatHistories[roomId] = [];
            chatHistories[roomId].push(formatted);
        });

        alert(`채팅방 ${roomId}에 연결되었습니다.`);
    }

    function moveRoom(newRoomId) {
        subscribeRoom(newRoomId);
    }

    function sendMessage() {
        if (!client || !client.active) {
            alert("서버에 연결되어 있지 않습니다.");
            return;
        }

        const message = document.getElementById("messageInput").value.trim();
        if (!message) return;

        client.publish({
            destination: "/pub/chat/" + currentRoom,
            body: JSON.stringify({
                roomId: currentRoom,
                sender: username,
                message: message
            }),
        });
        document.getElementById("messageInput").value = "";
    }

    function disconnect() {
        if (sub) sub.unsubscribe();
        if (client) client.deactivate();
        currentRoom = null;
        alert("연결이 종료되었습니다.");
    }
</script>
</body>
</html>
