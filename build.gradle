plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'ks.com'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // spring
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // kafka
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework:spring-messaging'

    // lombok
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'

    // DB
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // view
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // websocket
    implementation'org.springframework.boot:spring-boot-starter-websocket'

    // test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.junit.jupiter:junit-jupiter:5.5.2"
    testImplementation "org.mockito:mockito-core:3.12.4"
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'

    // jwt
    implementation group: 'io.jsonwebtoken', name: 'jjwt-api', version: '0.11.5'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-impl', version: '0.11.5'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-jackson', version: '0.11.5'

    // Swagger UI
    implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.8.11'
}

tasks.named('test') {
    useJUnitPlatform()
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test, compileJava, processResources
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    // 메인 애플리케이션
                    '**/BudgetManagementProjectApplication.class',

                    // Config 패키지
                    '**/global/config/**',

                    // DTO 패키지들
                    '**/feature/budget/dto/**',
                    '**/feature/chat/dto/**',
                    '**/feature/expenditure/dto/**',
                    '**/feature/user/dto/**',

                    // Entity 패키지들
                    '**/feature/budget/entity/**',
                    '**/feature/chat/entity/**',
                    '**/feature/expenditure/entity/**',
                    '**/feature/role/entity/**',
                    '**/feature/token/entity/**',
                    '**/feature/user/entity/**',

                    // Global 패키지들
                    '**/global/common/**',
                    '**/global/jwt/**',
                    '**/global/security/**',

                    // Repository 패키지들 (선택사항)
                    // '**/repository/**',
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    violationRules {
        rule {
            element = 'BUNDLE'  // CLASS → BUNDLE로 변경
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.6  // 현재 전체 커버리지에 맞춤
            }
        }
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/BudgetManagementProjectApplication.class',
                    '**/global/config/**',
                    '**/feature/budget/dto/**',
                    '**/feature/chat/dto/**',
                    '**/feature/expenditure/dto/**',
                    '**/feature/user/dto/**',
                    '**/feature/budget/entity/**',
                    '**/feature/chat/entity/**',
                    '**/feature/expenditure/entity/**',
                    '**/feature/role/entity/**',
                    '**/feature/token/entity/**',
                    '**/feature/user/entity/**',
                    '**/global/common/**',
                    '**/global/jwt/**',
                    '**/global/security/**',
            ])
        }))
    }
}

check {
    dependsOn jacocoTestCoverageVerification
}